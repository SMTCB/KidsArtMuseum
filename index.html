<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FMB / ART — Museu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="gallery.css">
<!-- Experimentation Room: template + painter effect styles -->
<link rel="stylesheet" href="art-templates.css">
<link rel="stylesheet" href="art-templates-3.css">
<link rel="stylesheet" href="art-templates-4.css">
<link rel="stylesheet" href="art-painters.css">
<link rel="stylesheet" href="art-painters-2.css">
<link rel="stylesheet" href="experimentation-room.css">
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="art-data.js"></script>
<script src="audio-data.js"></script>

<!-- Original per-piece animations -->
<script type="text/babel" src="art-animations.jsx"></script>

<!-- Experimentation Room: 33 template + painter effects -->
<!-- Load order matters: each file appends to window.ANIMS + window.TEMPLATE_LIBRARY -->
<script type="text/babel" src="art-templates.jsx"></script>
<script type="text/babel" src="art-templates-3.jsx"></script>
<script type="text/babel" src="art-templates-4.jsx"></script>
<script type="text/babel" src="art-painters.jsx"></script>
<script type="text/babel" src="art-painters-2.jsx"></script>

<!-- Experimentation Room component (reads window.TEMPLATE_LIBRARY + window.ANIMS) -->
<script type="text/babel" src="experimentation-room.jsx"></script>

<!-- Gallery shell — must be last so all components are registered first -->
<script type="text/babel" src="gallery-core.jsx"></script>

<script type="text/babel">
const THEMES = [
  { id: "whitecube", label: "Cubo Branco" },
  { id: "wall",      label: "Parede de Galeria" }
];

// Artists come from the artwork data (first appearance order); slug = lowercase name.
const ARTISTS = [...new Set(ART.map(a => a.artist))];
const slugOf = (name) => name.toLowerCase();

// Routes: #/todos · #/<artista> · #/<artista>/<obra>
function parseHash() {
  const [, who, piece] = location.hash.split("/");
  const artist = ARTISTS.find(a => slugOf(a) === who) || null;
  const art = piece && ART.find(a => a.id === piece && (!artist || a.artist === artist));
  return { artist, openId: art ? art.id : null };
}
const hashOf = (artist, openId) =>
  "#/" + (artist ? slugOf(artist) : "todos") + (openId ? "/" + openId : "");

function App() {
  const [theme, setTheme] = React.useState(() => {
    const stored = localStorage.getItem("fmb-theme");
    return (stored === "whitecube" || stored === "wall") ? stored : "wall";
  });
  const [route, setRoute] = React.useState(parseHash);

  React.useEffect(() => {
    localStorage.setItem("fmb-theme", theme);
  }, [theme]);

  React.useEffect(() => {
    const on = () => setRoute(parseHash());
    window.addEventListener("popstate", on);
    return () => window.removeEventListener("popstate", on);
  }, []);

  const go = (artist, openId, mode) => {
    const url = hashOf(artist, openId);
    if (mode === "push") history.pushState({ fmbOpen: 1 }, "", url);
    else history.replaceState(openId ? history.state : null, "", url);
    setRoute({ artist, openId });
  };
  const onOpen = (id) => go(route.artist, id, "push");
  const onStep = (id) => go(route.artist, id, "replace");
  const onClose = () => {
    if (history.state && history.state.fmbOpen) history.back();
    else go(route.artist, null, "replace");
  };

  return (
    <div className="app" data-screen-label="Museum Hall">
      <nav className="app-bar" aria-label="Galeria">
        <span className="app-bar-brand">FMB &middot; ART</span>
        <div className="app-bar-group" role="group" aria-label="Artista">
          {[null, ...ARTISTS].map(a => (
            <button
              key={a || "todos"}
              className={"app-bar-tab " + (route.artist === a ? "is-active" : "")}
              aria-pressed={route.artist === a}
              onClick={() => go(a, null, "replace")}
            >{a || "Todos"}</button>
          ))}
        </div>
        <div className="app-bar-group" role="group" aria-label="Estilo da galeria">
          {THEMES.map(t => (
            <button
              key={t.id}
              className={"app-bar-tab app-bar-style " + (theme === t.id ? "is-active" : "")}
              aria-pressed={theme === t.id}
              onClick={() => setTheme(t.id)}
            >{t.label}</button>
          ))}
        </div>
      </nav>

      <Hallway theme={theme} artist={route.artist} key={theme + (route.artist || "")}
        openId={route.openId} onOpen={onOpen} onClose={onClose} onStep={onStep} />

      <div className="app-hint">
        {theme === "wall"
          ? "Clica numa obra para a ver de perto"
          : "Scroll horizontal · Clica numa obra para a ver de perto"}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
